    meaning: "Clock-correlation length (Temporal Topology coherence length)"
    value: 4200.0
    units: "km"
    class: "calibrated"
    first_paper: 1
    used_in: [1, 2, 3, 6, 14, 17]
    description: "Canonical terrestrial correlation length for all forward analysis (terrestrial clock FEM, rho_T chain, etc.), adopted at 4,200 km on the IGS precise-product branch of the estimator family (25-year multi-center GNSS, Papers 1-2/6; long-span code 4,201 +/- 1,967 km). The fitted scale is product-dependent: precise-product bracket ~1.9-4.5x10^3 km with epoch/window scatter dominant; raw SPP channels ~0.7-1.1x10^3 km; raw ionofree 4,767 +/- 835 km. Paper 14 MGEX held-out verification (~1 yr combined-clock product, lambda = 1,862 +/- 112 km; annual-direction scan projection-degenerate and does not localize a CMB frame) corroborates a distance-structured signal on a different product but is not adopted for dimensional normalization. Cross-scale closure (steps 03-04): lambda_T is identified with the geometric saturation radius R_T = (3M/(4pi*rho_T))^{1/3}, not the Compton wavelength; the conditional Green-function covariance has its 1/e crossing near R_T (~4,003-4,012 km) without inserting the measured scale. Lab-scale crustal value is LAB_COHERENCE_LENGTH_M = 50 km."

