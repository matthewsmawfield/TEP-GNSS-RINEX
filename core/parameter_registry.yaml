  - symbol: "rho_T"
    latex: "\\rho_T"
    meaning: "Temporal Topology saturation scale (observationally proxied by density)"
    value: 20.0
    units: "g cm^{-3}"
    class: "calibrated"
    first_paper: 6
    used_in: [6, 14, 17, 18, 23, 24]
    description: "Phenomenological proximity scale at which collective many-body screening suppresses observable temporal shear, observationally proxied by the density rho_T ~ 20 g/cm^3. Corpus convention (decided 2026-09-28): rho_T = 20 g/cm^3 is the formal normalization adopted on the IGS precise-product branch (lambda_T ~ 4,200 km), not an independently measured constant. The fitted correlation-length family is estimator-dependent — precise-product bracket ~1.9-4.5x10^3 km (rho_T ~ 8-70 g/cm^3 effective band, epoch/window scatter dominant), raw channels bound below at ~0.7-1.1x10^3 km, MGEX held-out corroboration 1,862 +/- 112 km — so the numerical rho_T inherits the band of the adopted branch. The geometric identification lambda_T = R_T inverts the adopted 4,200 km to rho_T = 19.24 g/cm^3 — a 3.8% self-consistency residual that is a calibration identity, not an independent derivation (step_03). The atomic-scale (R_T(m_p) ~ a_0) and magnetar (P_crit ~ 6.8 s) anchors are estimator-independent cross-checks on the adopted normalization. Density is an observable proxy, not the causal parameter; the fundamental scale is geometric overlap governed by the packing fraction eta = (r_c/lambda_F)^3. Note: rho_c is reserved for per-cluster central density (Paper 10)."

  - symbol: "lambda_T"
