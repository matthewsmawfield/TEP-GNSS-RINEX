# TEP Parameter Registry
# ======================
# Canonical source of truth for all parameters used across the TEP corpus.
# Keep YAML copies identical; render and verify from the corpus root with
# corpus-notes/tools/render_parameter_registry.py --write / --check.

schema_version: 1
last_updated: "2026-09-26"

parameter_classes:
  fundamental: "Axiomatic or theoretically fixed parameter; changes would alter the framework itself."
  calibrated: "Determined from experimental data with well-defined uncertainty; shared across analyses."
  benchmark: "Declared numerical reference or prior; not an empirical calibration or independently derived value."
  observable_response: "Domain-level empirical transfer coefficient; specific to a measurement domain."
  nuisance: "Required for analysis but not a TEP parameter of direct physical interest."
  exploratory: "Under investigation; value or existence not yet firmly established."
  derived: "Structure or value computed from the action/pipeline; where the value additionally requires an environmental input or is a calibration identity, the description must say so."

parameters:
  - symbol: "beta_A"
    latex: "\\beta_A"
    meaning: "Conformal coupling strength in A(phi) = exp(beta_A * phi / M_Pl)"
    value: -1.0
    units: "dimensionless"
    class: "fundamental"
    first_paper: 0
    used_in: [0, 1, 2, 3, 4, 6, 10, 11, 12, 14, 15, 17, 18, 19, 22, 23, 24, 25, 26, 28, 29, 31, 32]
    description: "Locked lab-scale convention. Universal conformal coupling governing clock-rate rescaling."

  - symbol: "rho_T"
    latex: "\\rho_T"
    meaning: "Temporal Topology saturation scale (observationally proxied by density)"
    value: 20.0
    units: "g cm^{-3}"
    class: "calibrated"
    first_paper: 6
    used_in: [6, 14, 17, 18, 23, 24]
    description: "Phenomenological proximity scale at which collective many-body screening suppresses observable temporal shear, observationally proxied by the density rho_T ~ 20 g/cm^3. Determined from terrestrial clock correlation data. The geometric identification lambda_T = R_T inverts the measured 4,200 km to rho_T = 19.24 g/cm^3 — a 3.8% self-consistency residual that is a calibration identity, not an independent derivation (step_03). Density is an observable proxy, not the causal parameter; the fundamental scale is geometric overlap governed by the packing fraction eta = (r_c/lambda_F)^3. Note: rho_c is reserved for per-cluster central density (Paper 10)."

  - symbol: "lambda_T"
    latex: "\\lambda_T"
    meaning: "Clock-correlation length (Temporal Topology coherence length)"
    value: 4200.0
    units: "km"
    class: "calibrated"
    first_paper: 1
    used_in: [1, 2, 3, 6, 14, 17]
    description: "Canonical terrestrial correlation length for all forward analysis (terrestrial clock FEM, rho_T chain, etc.). From 25-year multi-center GNSS (Papers 1-2/6). Cross-scale closure (steps 03-04): lambda_T is identified with the geometric saturation radius R_T = (3M/(4pi*rho_T))^{1/3}, not the Compton wavelength; the conditional Green-function covariance has its 1/e crossing near R_T (~4,003-4,012 km) without inserting the measured scale. Paper 14 MGEX held-out verification (~1 yr combined-clock product, lambda = 1,862 +/- 112 km, axis 21.4 deg from CMB dipole) confirms a distance-structured signal on a different product but is not adopted for dimensional normalization. Lab-scale crustal value is LAB_COHERENCE_LENGTH_M = 50 km."

  - symbol: "alpha_log"
    latex: "\\alpha_{\\log}"
    meaning: "Lab-scale density-sector coupling"
    value: -7.66e-3
    units: "dimensionless"
    class: "exploratory"
    first_paper: 21
    used_in: [21]
    description: "Historical exploratory value from retired Paper 21. Negative by field-equation sign. Magnitude determined from requirement that TEP reproduce correct order of magnitude for laboratory metrology shifts."

  - symbol: "beta_geom"
    latex: "\\beta_{\\text{geom}}"
    meaning: "Mass-sector geometric coupling"
    value: 1.50e-4
    units: "dimensionless"
    class: "exploratory"
    first_paper: 21
    used_in: [21]
    description: "Historical exploratory parameter from retired Paper 21. Geometric coupling for mass-dependent scalar field contributions."

  - symbol: "M_ref"
    latex: "M_{\\text{ref}}"
    meaning: "Reference mass scale for geometric coupling"
    value: 1.0e18
    units: "kg"
    class: "exploratory"
    first_paper: 21
    used_in: [21]
    description: "Historical parameter from retired Paper 21. Threshold mass where phi_mass ~ beta_geom."

  - symbol: "kappa_canonical"
    latex: "\\kappa_{\\text{canonical}}"
    aliases: ["kappa_gal", "kappa_Gal"]
    meaning: "Canonical galaxy-scale observable response coefficient"
    value: 9.6e5
    units: "mag"
    class: "benchmark"
    first_paper: 11
    used_in: [11, 12]
    description: "Expected bare-scale coupling for Cepheid P-L shifts before environmental screening. Declared theory benchmark used as prior in multi-anchor regression; the magnitude unit records the observational channel, not a physical dimension of the coupling. Step_05 derives the transfer structure (Gamma_gal inherited from the Cepheid projector with redshift transfer factor), but the numerical benchmark retains its declared provenance. Paper 12 uses the alias kappa_gal = kappa_canonical."

  - symbol: "kappa_Cep"
    latex: "\\kappa_{\\text{Cep}}"
    meaning: "Cepheid observable response coefficient"
    value: null
    units: "dimensionless"
    class: "observable_response"
    first_paper: 11
    used_in: [11, 12]
    description: "Domain-level transfer coefficient mapping TEP structure to Cepheid period-luminosity shifts. Fitted, not fundamental. Step_05 derives the transfer structure: kappa_Cep = |beta_A| S_Cep Gamma_Cep, where Gamma_Cep is the differential host-galaxy ambient field two-point function from the linearized scalar fluctuation equation — derived up to the environmental input (host-galaxy ambient field)."

  - symbol: "kappa_MSP"
    latex: "\\kappa_{\\text{MSP}}"
    meaning: "Pulsar in-equation acceleration coupling (screened)"
    value: 0.05
    units: "dimensionless"
    class: "observable_response"
    first_paper: 10
    used_in: [10, 17]
    description: "In-equation coupling in the pulsar spin-down equation; unsuppressed geometric amplitude ~10^6, screened to kappa_MSP^emp ~ 0.05. These numbers and the density-scaling result (observed slope Gamma=0.393+/-0.079 vs Newtonian CMC baseline Gamma_N=0.748+/-0.039, 4.1-sigma rejection; TEP prediction Gamma_TEP=2*Gamma_N-1~0.50 matches at 0.9-sigma) are Paper 10's (TEP-COS) own real empirical+theoretical result from 550 real MSPs (199 globular-cluster + 351 field) and a 20-cluster/18,813-MSP N-body CMC null baseline -- NOT computed by step_05. Paper 0's step_05 (derive_msp) instead runs its own separate, illustrative order-of-magnitude estimate (generic placeholder cluster, Gamma_MSP=1 direct proper-time projection) that does not reproduce or connect to Paper 10's slope test; it should not be read as independent confirmation of it. Corrected 2026-09-16 -- an earlier version of this description incorrectly attributed Paper 10's real result to step_05."

  - symbol: "tilde_kappa_MSP"
    latex: "\\tilde\\kappa_{\\text{MSP}}"
    meaning: "Full empirical pulsar response coefficient (pipeline inversion)"
    value: 29000.0
    value_uncertainty: 45000.0
    units: "dimensionless"
    class: "observable_response"
    first_paper: 10
    used_in: [10, 11, 6]
    description: "Full response coefficient from step_44_kappa_msp_prior.json, obtained by inverting the 0.63 dex raw excess with real cluster parameters: κ̃_MSP = (2.9 ± 4.5) × 10⁴. This is the observable response; the pre-screening geometric amplitude is ~10⁶ (see kappa_MSP). Suitable for cross-probe comparison with kappa_Cep. Effective screening factor S_MSP ~ 0.027 relative to unsuppressed ~10⁶."

  - symbol: "kappa_WB"
    latex: "\\kappa_{\\text{WB}}"
    meaning: "Wide-binary observable response coefficient"
    value: null
    units: "dimensionless"
    class: "observable_response"
    derivation_status: "partial; transition-scale structure only, amplitude not derived"
    first_paper: 0
    used_in: [0, 16]
    description: "Wide-binary channel. Only the transition radius is derived (step_05): R_s ~ 2609 AU from the cross-scale acceleration condition (M_binary, M_gal, r_gal, beta_A only, no wide-binary input), matching observed 2646 +/- 182 AU within 1.4%. kappa_WB itself is NOT derived: an earlier version asserted a screening fraction S(R_s)=0.5 without derivation to produce a velocity excess alpha=sqrt(2)-1~0.414 (~13% from observed 0.366), but the radial ODE's own computed screening at R_s is S_sigma~0.994 (essentially unscreened), which the same formula would instead put at alpha~0.73 -- the assumed 0.5 was doing the work, not the theory. Paper 13 (TEP-WB) does not independently derive alpha_sat=0.366 either: it reports a mass-dependent self-screening fit alpha_sat(M)=alpha_0*exp(-M/M_screen) (alpha_0=1.74+/-0.26, M_screen=0.46+/-0.04 Msun) fit to the same wide-binary sample used to validate it. No validated Gamma_WB exists; kappa_WB is left open pending a real derivation."

  - symbol: "kappa_LLR"
    latex: "\\kappa_{\\text{LLR}}"
    meaning: "LLR/flyby observable response coefficient"
    value: 1.59e-14
    units: "dimensionless"
    class: "derived"
    first_paper: 0
    used_in: [0, 8, 15, 17]
    description: "LLR/flyby channel response coefficient. Derived (step_05): kappa_LLR = |beta_A| S_LLR Gamma_LLR, with Gamma_LLR = 1 (orbital range projector; the fitted Keplerian monopole is absorbed) and S_LLR = S_Sigma(g_lunar) = 1.59e-14 from the corpus screening operator S_Sigma(g) = [1+(g/g_t)^2]^-1, g_t = cH_0/(2 beta_A^2) (master-action closure, R11/step_27; equivalently the pairwise form [1+(R_s/s)^4]^-1). Small but nonzero at lunar distance; far below the current LLR residual floor. Earlier versions used a Yukawa propagator exp(-r/R_T)(1+r/R_T) treating the density-transition radius R_T ~ 4146 km as a Compton range — an inconsistent massive-scalar ansatz superseded by the derived P(X) screening operator. Flyby: conformal channel screened to delta_v/v ~ 1.7e-30 at the surface field; any real flyby residual requires the disformal sector (step_08). Corrected 2026-09-25."

  - symbol: "Gamma_X"
    latex: "\\Gamma_X"
    meaning: "Channel-specific geometric projector"
    value: null
    units: "dimensionless"
    class: "derived"
    first_paper: 0
    used_in: [0, 1, 2, 6, 10, 11, 12, 14, 15, 16, 17]
    description: "Geometric/kinematic projector for channel X (steps 04-05): the dimensionless channel-geometry factor in kappa_X = |beta_A| S_X Gamma_X. Derived values: Gamma_GNSS = |beta_A| (two-point clock covariance is quadratic in the coupling; the fluctuation Green's-function spectrum and correlation length lambda_T ~ R_T enter the channel functional F_X, not the projector), Gamma_Cep = 5/ln10 ~ 2.17, Gamma_MSP = 1 (proper-time projection), Gamma_gal = Gamma_Cep (1+z)^(beta_A Delta u) ~ 2.17, Gamma_LLR = 1 with the S_Sigma(g) suppression carried by S_X; Gamma_WB partial (alpha_sat open). Earlier versions conflated the unit-source Green's-function normalization with the projector (Gamma_GNSS ~ 1e-84, Gamma_LLR ~ 5e-39 via a Yukawa-on-R_T ansatz); corrected 2026-09-25 to the dimensionless channel-geometry convention."

  - symbol: "strong_field_status"
    latex: "\\text{strong-field}"
    meaning: "Strong-field hyperbolicity status"
    value: null
    units: "dimensionless"
    class: "derived"
    first_paper: 0
    used_in: [0]
    description: "Strong-field analysis (step_06): perturbative Einstein-conformal-scalar sector is strongly hyperbolic; GW170817 bounds the observed propagation-sector tensor-cone split (~few x 10^-15) but does not directly bound the matter-dependent scalar principal coefficients (KMZ 2012). TEP EOM remain second-order (Horndeski-class, no Ostrogradsky); scalar-Gauss-Bonnet is likewise second-order, though its characteristics can fail or degenerate on nontrivial backgrounds (Papallo-Reall 2017). Necessary conditions: Z_t > 0, Z_s > 0, metric nondegeneracy — not sufficient: A=1, B=1, q=0, rho=3, p=2 is regular but elliptic (Z_t=4, Z_s=-1, c_s^2=-1/4). Full coupled strong-field proof open."

