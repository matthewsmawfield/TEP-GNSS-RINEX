  - symbol: "B"
    latex: "B(\\phi)"
    meaning: "Disformal coupling function"
    value: null
    units: "mass^{-4} for a dimension-one canonical scalar; dimensionless only in explicitly nondimensionalized benchmark coordinates"
    class: "fundamental"
    first_paper: 0
    used_in: [0, 4, 9, 22, 28]
    description: "Disformal coupling function B(phi). GW170817 constrains the path-integral combination B(phi)(dphi)^2 along observed late-time astrophysical paths: |c_gamma - c_g|/c < few x 1e-15. This does NOT require B to vanish identically in all regimes. B(phi) = 0 in the conformal limit (holonomy vanishes). The nonzero form B(phi) = B0 * |phi|^2 / (1 + |phi|^2) * exp(-phi^4 / (2*sigma_B^4)) (quartic-Gaussian ultra-damped shear bump) is implemented in Paper 28 bh_common.py, with B0, n_B, sigma_B as shape parameters. B activates the disformal shear near strong-field regions while decaying super-polynomially in the deep core. On spacelike-gradient configurations the signature margin is wide (Paper 0 step 52); in the timelike-gradient drift sector the bare envelope is ambient-lapse-supercritical at absorber epochs for phenomenological normalizations (realized cap B0 <~ 0.03 at z ~ 2.5-3.6, phibar ~ ln(1+z), du/dt ~ H_T(z); Paper 29 gate10c), so ambient closure through the environmental gate is lapse-mandated, not merely phenomenological. The path-dependent GW constraint is satisfied because B(phi)(dphi)^2 is negligible along weak-field late-time astrophysical paths. Admissibility: the null-cone condition selects B >= 0 as the unconditional branch — the signature condition B(dphi)^2 > -A^2 then holds wherever the matter metric is non-degenerate, the disformal perfect-fluid principal coefficients obey Z_t, Z_s >= 1, and the matter cone lies inside or on the gravitational cone. B < 0 is not excluded a priori but carries a pointwise ledger on each realized configuration — |B|(dphi)^2 < A^2 (signature), Z_t, Z_s > 0 (hyperbolicity), no matter-cone excursions beyond the gravitational cone (causality) — and sign-indefinite B(phi) inherits the same condition along the realized profile. Configurations computed to date fail it on the negative branch (the step_13 volume-balance reconstruction drives Q = 1+(B/A^2)(dphi)^2 -> -1, a matter-metric degeneracy with superluminal longitudinal photons; Paper 0 App. E R5). Eligibility vetoes (corpus registry, issue 29-4): any candidate form must satisfy (i) Cassini and GW170817 path bounds along realized profiles, (ii) ambient-lapse sub-criticality under the self-consistent map 1+z = N(0)/N(phi_bar) with N = A*sqrt(1-u), u = B(dphi)^2/A^2 — the veto that excludes the descent-tracking form (Paper 29 gate10: u(phi_bar) = 1 - 8e-5 ambient at all three absorber epochs, presenting z_obs = 2.5-3.6 at 1+z ~ 390-595; required phi_bar = -3.35 to -3.46 violates the sign convention), and (iii) three-sightline amplitude transfer without per-sightline retuning. Candidate status: Paper-0/28 quartic-Gaussian envelope = live corpus candidate (fails BBN closure under the imported LCDM rate — B0 dispersion factor ~3-4 and Cassini-excluded normalizations — but not ruled out as a form); power-law B0*phi^n = fails transfer (n=2 Cassini-excluded unscreened, n=5 loses Lorentzian signature above z~3.4); descent-tracking B0*phi^4/(phi_c^4+phi^4)*e^{-lam phi} = EXCLUDED by veto (ii) notwithstanding inverse-root concordance to 1.0001; environment-modulated B_eff = B(phi)*G(X_local), closed in the ambient and saturating at G ~ 1e-3 inside wells (required gate slope dG/d ln(dphi) ~ (4-7)e-4 per e-fold, consistent across the three BBN sightlines within a factor 1.6; Paper 29 gate10b) = the only admissible form for the absorber amplitude channel, a D2(phi,X)-class generalisation."

